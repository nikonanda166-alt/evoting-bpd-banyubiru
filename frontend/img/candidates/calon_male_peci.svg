<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMalePeci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba86b"/>
    </linearGradient>
    <linearGradient id="peciGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldBanner2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Latar Belakang Studio -->
  <rect width="400" height="480" fill="url(#bgGradMalePeci)"/>
  <circle cx="200" cy="180" r="140" fill="#ffffff" opacity="0.06"/>

  <!-- Pita Merah Putih Pojok Kanan Atas -->
  <g transform="translate(320, 0)">
    <polygon points="0,0 80,0 80,20 20,80 0,80" fill="#ef4444"/>
    <polygon points="0,80 20,80 80,20 80,40 40,80 0,80" fill="#ffffff"/>
  </g>

  <!-- Tubuh / Jas Hitam Formal -->
  <path d="M65,480 C75,355 125,315 200,315 C275,315 325,355 335,480 Z" fill="#0f172a"/>
  
  <!-- Kemeja Putih Berdasi Merah -->
  <polygon points="175,315 225,315 205,420 195,420" fill="#ffffff"/>
  <!-- Dasi Merah Maroon -->
  <polygon points="195,335 205,335 212,415 200,435 188,415" fill="#991b1b"/>

  <!-- Kerah Jas Hitam -->
  <polygon points="145,315 180,395 195,335 175,315" fill="#1e293b"/>
  <polygon points="255,315 220,395 205,335 225,315" fill="#1e293b"/>

  <!-- Leher -->
  <rect x="180" y="240" width="40" height="85" fill="url(#skinMale)" rx="10"/>

  <!-- Kepala & Wajah -->
  <ellipse cx="200" cy="195" rx="60" ry="72" fill="url(#skinMale)"/>

  <!-- Peci Hitam Nasional -->
  <path d="M142,150 L146,95 C146,92 148,90 152,90 L248,90 C252,90 254,92 254,95 L258,150 Z" fill="url(#peciGrad)"/>
  <!-- Lekukan Peci Bagian Depan -->
  <path d="M140,150 Q200,165 260,150 L256,138 Q200,153 144,138 Z" fill="#090d16"/>
  <!-- Lambang Pin Emas di Peci -->
  <circle cx="165" cy="130" r="5" fill="#fbbf24"/>

  <!-- Fitur Wajah Pria: Alis Tegas, Mata Bersahabat, Senyum Wibawa -->
  <path d="M165,172 Q178,165 188,170" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M212,170 Q222,165 235,172" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <circle cx="178" cy="182" r="5.5" fill="#0f172a"/>
  <circle cx="222" cy="182" r="5.5" fill="#0f172a"/>
  <circle cx="176" cy="180" r="1.5" fill="#ffffff"/>
  <circle cx="220" cy="180" r="1.5" fill="#ffffff"/>

  <!-- Hidung Proporsional -->
  <path d="M200,185 L196,212 L204,212 Z" fill="#ea580c" opacity="0.5"/>

  <!-- Senyum Ramah Berwibawa -->
  <path d="M184,232 Q200,246 216,232" stroke="#991b1b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Bingkai Bawah Nama -->
  <rect x="20" y="420" width="360" height="44" rx="10" fill="url(#goldBanner2)"/>
  <text x="200" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">FOTO RESMI CALON ANGGOTA BPD</text>
</svg>
